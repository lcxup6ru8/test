<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>來都來了，公會</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--wood:#7a4e2d;--dk:#3b2616;--pa:#f3e3bd;--pa2:#e8d29b;--gold:#e0a82e;--grn:#4f9a56;--ora:#e08a2e;--blue:#4a6fd0;--ink:#2a1a0e}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;overflow-x:hidden}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--dk);color:var(--ink);line-height:1.6;padding-bottom:90px}
h1,h2,h3,.px{font-family:"DotGothic16","Noto Sans TC",monospace}
main{max-width:760px;margin:0 auto;padding:10px}
section,.card{background:var(--pa);border:3px solid var(--wood);border-radius:10px;padding:12px;margin:12px 0;box-shadow:0 3px 0 #1d110a}
h2{margin:0 0 8px;font-size:20px;color:var(--wood)}h3{margin:10px 0 4px;font-size:16px}
button,select,input,textarea{font:inherit;min-height:44px;border-radius:8px;border:2px solid var(--wood);padding:6px 10px;background:#fff8e4;color:var(--ink);max-width:100%}
button{background:var(--gold);font-weight:700;cursor:pointer;box-shadow:0 3px 0 #8a6414}
button:active{transform:translateY(3px);box-shadow:none}
button.sm{min-height:34px;padding:2px 8px;font-size:13px}button.g{background:var(--pa2)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 120px;min-width:0}
label{display:block;font-size:13px;font-weight:700}
.hd{background:linear-gradient(#5a3a22,#3b2616);color:#fff4d6;border-radius:10px;padding:10px;border:3px solid var(--gold)}
.hd .scene{display:flex;gap:10px;align-items:flex-end}
.ban{position:relative;border:3px solid var(--gold);border-radius:8px;overflow:hidden;background:#2b1b10;display:flex;justify-content:center}
.ban .bg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(18px) brightness(.7)}
.av{position:relative;display:block;width:100%;height:auto;max-height:420px;object-fit:contain}
svg.av{width:auto;height:170px}
.bub{min-width:0;background:var(--pa);color:var(--ink);padding:8px 10px;border-radius:10px;flex:1;font-size:14px;position:relative}
.counter{height:14px;background:repeating-linear-gradient(90deg,#8a5a34 0 20px,#74482a 20px 22px);margin-top:6px;border-radius:3px}
.board{background:var(--dk);color:var(--gold);text-align:center;border-radius:8px;border:4px solid var(--wood);padding:6px;font-size:34px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{background:#fff8e4;border:2px solid var(--pa2);border-radius:6px;padding:3px;font-size:11px;min-height:64px;overflow:hidden;word-break:break-all}
.cell b{display:block}.cell.rest{color:#8a7a5a}
.bar{height:14px;border-radius:7px;background:#d9ecc9;position:relative;overflow:hidden;border:1px solid var(--pa2)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar u{position:absolute;top:0;bottom:0;background:#9fd08a66}
.bt{display:flex;gap:4px;flex-wrap:wrap}.bt span{cursor:pointer;min-width:32px;display:inline-flex;justify-content:center;border-radius:8px}
.bt svg{width:21px;height:56px}.ic{width:20px;height:22px;vertical-align:-5px;margin-right:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:12px}
.cal div{background:#fff8e4;border:2px solid var(--pa2);border-radius:6px;min-height:46px;padding:1px}
.cal .full{box-shadow:0 0 10px 3px var(--gold);border-color:var(--gold)}
@media(prefers-reduced-motion:no-preference){.cal .full span{display:inline-block;animation:pop .6s ease-out}@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.4)}100%{transform:scale(1)}}}
dialog{border:3px solid var(--wood);background:var(--pa);border-radius:12px;width:min(94vw,520px);padding:12px;color:var(--ink)}
dialog::backdrop{background:#000a}
.res{background:#fff8e4;border:2px dashed var(--wood);border-radius:8px;padding:6px 8px;font-size:13px}
.small{font-size:12px;color:#6a553a}.rec{display:flex;justify-content:space-between;gap:6px;align-items:center;border-bottom:1px dashed var(--wood);padding:4px 0;font-size:13px}
#fab{position:fixed;right:10px;bottom:12px;z-index:9;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#fab .m{display:none;flex-direction:column;gap:6px}#fab.open .m,#fab:hover .m,#fab:focus-within .m{display:flex}
#fab button{border-radius:24px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--pa);border:3px solid var(--gold);border-radius:12px;padding:8px 12px;max-width:90vw;display:none;z-index:20}
@media(min-width:700px){#fab{top:40%;bottom:auto;right:0;transform:translateX(calc(100% - 22px));transition:transform .2s}#fab:hover,#fab:focus-within{transform:none}}
</style></head><body><main id="app"></main>
<div id="fab"><div class="m" id="fabm"></div><button onclick="this.parentNode.classList.toggle('open')" aria-label="快捷選單">✦</button></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
const KEY='guildTrainingCanteen_v1';
const S0={guild:'來都來了',npc:'嘎哩貓蕊',persona:'溫柔幽默霸氣中性帥氣女生',look:'貓耳中性帥氣灰黑色短髮女生',me:'愛瞇謀低家',age:'',sex:'',h:'',w:'',rhr:'',vo2:'',mhr:'',p0:3,p1:6,g0:1.5,g1:4,v0:3,v1:5,f0:3,f1:7,k0:'',k1:'',cc:800,bt:5,wday:1,url:'',avatar:'',act:1.375,kp:75,kg:70,kv:25,kf:45,gh_owner:'',gh_repo:'',gh_branch:'main',avatarExt:null,avatarV:0};
const TYPES=[['高強度間歇／循環訓練',8.0],['跑步（約 8 km/h）',8.3],['跑步（約 10 km/h）',9.8],['跑步機坡走（15%、3.5 km/h）',7.2],['快走（約 5.6 km/h）',4.3,1],['一般步行',3.5,1],['騎自行車（休閒 <16 km/h）',4.0],['騎自行車（中等 16–19 km/h）',6.8],['游泳（一般）',5.8],['重量訓練（8–15 下、多組）',3.5],['重量訓練（高強度）',6.0],['羽球（一般）',5.5],['籃球（一般）',6.5],['瑜珈（哈達）',2.5],['其他（自填 METs）',3.5]];
let D;
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
 D=D||{};D.settings=Object.assign({},S0,D.settings||{});D.workouts=D.workouts||[];D.meals=D.meals||[];D.weights=D.weights||[];D.water=D.water||{};D.types=D.types||[];D.setup=D.setup||false}
function save(sync=true){if(sync)D.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('儲存空間不足，請先匯出備份（頭像圖可能太大）')}if(sync)autoSync()}
let syncT,syncSt='';
function setSt(t){syncSt=t;['syncSt','syncHd'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=t})}
function autoSync(){if(!D.settings.url)return;clearTimeout(syncT);setSt('☁ 等待同步…');syncT=setTimeout(pushCloud,1500)}
async function pushCloud(){if(!D.settings.url)return false;
 if(!navigator.onLine){setSt('☁ 目前離線，尚未同步；上線後再做一次任何修改，或按「上傳」');return false}
 try{const c=Object.assign({},D,{settings:Object.assign({},D.settings,{avatar:''})});
  await fetch(D.settings.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',data:c})});
  const t=new Date();setSt('☁ 已送出同步 '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'));return true}
 catch(e){setSt('☁ 同步失敗：請檢查網路，並用下載的 .html 檔開啟');return false}}
load();
const $=s=>document.querySelector(s),S=()=>D.settings;
const pad=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date()),pd=s=>new Date(s+'T00:00:00');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const wkStart=s=>{const d=pd(s);return addD(s,-((d.getDay()+6)%7))};
const num=x=>{const v=parseFloat(x);return isNaN(v)?NaN:v};
const r1=x=>Math.round(x*10)/10,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4500)}
/* ---- 計算 ---- */
function lastW(){const w=[...D.weights].sort((a,b)=>a.d<b.d?-1:1).pop();return w?w.kg:num(S().w)}
function prof(){const s=S(),w=lastW(),h=num(s.h),a=num(s.age);let bmr=NaN,vr=NaN;
 if(w>0&&h>0&&a>0&&(s.sex==='男'||s.sex==='女')){bmr=s.sex==='男'?66.473+13.7516*w+5.0033*h-6.755*a:655.0955+9.5634*w+1.8496*h-4.6756*a;vr=bmr/1440/5*1000/w}
 const mhr=num(s.mhr)||(a>0?208-0.7*a:NaN);return{w,h,a,bmr,vr,mhr,rhr:num(s.rhr),vo2:num(s.vo2)}}
function calc(r){const p=prof(),met=num(r.met),min=num(r.min),o={};
 o.std=met*min;
 if(p.vr>0)o.pers=met*3.5/p.vr*min;
 if(num(r.hr)>0&&p.rhr>0&&p.vo2>0&&p.mhr>p.rhr&&p.vr>0&&!/重量/.test(r.type||'')){
  const hrr=Math.min(1,Math.max(0,(num(r.hr)-p.rhr)/(p.mhr-p.rhr)));o.hrr=hrr;o.hrMet=(p.vr+hrr*(p.vo2-p.vr))/p.vr;o.hr=o.hrMet*min}
 if(num(r.kcal)>0&&p.w>0&&min>0){o.calMet=num(r.kcal)/p.w/(min/60)+1;o.cal=o.calMet*min}
 o.main=o.hr??o.pers??o.std;o.src=o.hr!=null?'心率推算':o.pers!=null?'個人化校正':'標準查表';return o}
const mv=r=>{const v=calc(r).main;return isNaN(v)?0:v};
function weekTotal(ws){let t=0;D.workouts.forEach(w=>{if(w.d>=ws&&w.d<=addD(ws,6))t+=mv(w)});return t}
/* ---- 飲食 ---- */
const CATS=[['p','豆魚蛋肉'],['g','全穀雜糧'],['v','蔬菜'],['f','油脂與堅果']];
function dayFood(d){const o={p:0,g:0,v:0,f:0,mw:0,n:0,kc:0,est:false};D.meals.filter(m=>m.d===d).forEach(m=>{CATS.forEach(c=>o[c[0]]+=num(m[c[0]])||0);o.mw+=num(m.water)||0;o.n++;const k=num(m.kcal);if(k>0)o.kc+=k;else{const t=S(),e=(num(m.p)||0)*(+t.kp||0)+(num(m.g)||0)*(+t.kg||0)+(num(m.v)||0)*(+t.kv||0)+(num(m.f)||0)*(+t.kf||0);if(e>0){o.kc+=e;o.est=true}}});o.q=D.water[d]||0;o.w=o.mw+o.q;return o}
const inR=(v,c)=>v>=S()[c+'0']&&v<=S()[c+'1'];
const allIn=f=>CATS.every(c=>inR(f[c[0]],c[0]));
const full=d=>{const f=dayFood(d);return f.n>0&&allIn(f)&&f.w>=S().bt};
function kcalRange(){const p=prof(),s=S();let a=num(s.k0),b=num(s.k1);if(isNaN(a)&&p.bmr>0)a=Math.round(p.bmr);if(isNaN(b)&&p.bmr>0)b=Math.round(p.bmr*(num(s.act)||1.375));return[a,b]}
function water(n){const d=today();D.water[d]=(D.water[d]||0)+n;save();render();say('water')}
function setWater(d,i){const f=dayFood(d);let t=f.w;const tgt=i+1;t=(t===tgt)?tgt-.5:(t===tgt-.5?tgt-1:tgt);D.water[d]=Math.max(0,t-f.mw);save();render();say('water')}
/* ---- 接待員 ---- */
function say(k){const s=S(),t=today(),f=dayFood(t),wk=Math.round(weekTotal(wkStart(t)));let m='';
 if(k==='w')m=wk>=1200?`這週累積 ${wk} METs-分鐘，已經超過每週 1200 的額外效益線了。`:wk>=600?`這週累積 ${wk} METs-分鐘，已經超過每週最低建議 600 了。`:`這週累積 ${wk} METs-分鐘，離最低建議 600 還有 ${600-wk}，慢慢來。`;
 else if(k==='m')m=`今天蔬菜 ${f.v} 份（範圍 ${s.v0}～${s.v1}）${inR(f.v,'v')?'，在範圍裡喔。':f.v<s.v0?'，還有空間。':'，比範圍多一點，沒關係。'}`;
 else if(k==='water')m=`今天喝了 ${f.w} 瓶，目標 ${s.bt} 瓶${f.w>=s.bt?'，達成了。':'。'}`;
 else if(k==='x')m='紀錄已更新。';
 const e=$('#bubTxt');if(e&&m)e.textContent=m;if(m)toast(s.npc+'：'+m)}
function greet(){const h=new Date().getHours(),s=S();const g=h<5?'夜深了':h<11?'早安':h<14?'午安':h<18?'下午好':'晚安';return`${g}，${s.me}。歡迎來到「${s.guild}」。${h>=21?'今天辛苦了，早點休息也是修行。':'今天想從哪一格開始？'}`}
const npcSvg=`<svg class="av" viewBox="0 0 16 18" shape-rendering="crispEdges"><rect width="16" height="18" fill="#2b1b10"/><path d="M3 1h2v3H3zM11 1h2v3h-2z" fill="#555"/><rect x="3" y="3" width="10" height="4" fill="#45454d"/><rect x="4" y="6" width="8" height="5" fill="#f1cfa8"/><rect x="5" y="8" width="1" height="1" fill="#222"/><rect x="10" y="8" width="1" height="1" fill="#222"/><rect x="7" y="10" width="2" height="1" fill="#b3604d"/><rect x="3" y="11" width="10" height="7" fill="#3a3a44"/><rect x="7" y="11" width="2" height="7" fill="#e0a82e"/></svg>`;
/* ---- 繪圖 ---- */
function bottleSvg(l,i){const b='M6.5 5h5v7c0 1.5 3 2.5 3 6v24a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3V18c0-3.5 3-4.5 3-6z',on=l>0;
 return`<svg viewBox="0 0 18 48" aria-hidden="true"><defs><clipPath id="bc${i}"><path d="${b}"/></clipPath></defs><path d="${b}" fill="#e6f2ff" fill-opacity=".7"/>${on?`<rect x="0" y="${l>=1?17:31}" width="18" height="30" fill="#7db8f5" clip-path="url(#bc${i})"/>`:''}<path d="${b}" fill="none" stroke="${on?'#5f9be0':'#a9c7ea'}" stroke-width="1.5" stroke-linejoin="round"/><rect x="6" y="1" width="6" height="4" rx="1" fill="${on?'#4a7fc9':'#a9c7ea'}"/><path d="M6.2 21v18" stroke="#fff" stroke-opacity=".85" stroke-width="1.4" stroke-linecap="round"/></svg>`}
const IC_DB='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>';
const IC_FK='<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v6a3 3 0 0 0 3 3v9M8 3v6M11 3v6a3 3 0 0 1-3 3M18 21V3c-2.7 1.4-3.8 4.2-3.8 7.4 0 1.9 1.1 2.9 3.8 3.1"/></svg>';
const icBottle=k=>bottleSvg(1,k).replace('<svg ','<svg class="ic" ');
function barHtml(v,lo,hi){const mx=Math.max(hi*1.3,v,1),c=v<lo?'#b98552':v<=hi?'var(--grn)':'var(--ora)';
 return`<div class="bar"><u style="left:${lo/mx*100}%;width:${(hi-lo)/mx*100}%"></u><i style="width:${Math.min(100,v/mx*100)}%;background:${c}"></i></div>`}
function weeklyChart(){const ws=wkStart(today()),a=[];for(let i=7;i>=0;i--){const s=addD(ws,-7*i);a.push([s,weekTotal(s)])}
 const mx=Math.max(1700,...a.map(x=>x[1]))*1.05,H=130,W=320,y=v=>H-v/mx*H+8;
 let s=`<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="最近8週 METs-分鐘">`;
 [[600,'#4f9a56','600'],[1200,'#4a6fd0','1200'],[1500,'#e08a2e','1500']].forEach(l=>s+=`<line x1="24" x2="${W}" y1="${y(l[0])}" y2="${y(l[0])}" stroke="${l[1]}" stroke-dasharray="4 3"/><text x="0" y="${y(l[0])+3}" font-size="9" fill="${l[1]}">${l[2]}</text>`);
 const pts=a.map((x,i)=>[43+i*36,y(x[1])]);
 s+=`<polyline fill="none" stroke="#7a4e2d" stroke-width="2" stroke-linejoin="round" points="${pts.map(q=>q.join(',')).join(' ')}"/>`;
 a.forEach((x,i)=>{s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="4" fill="#e0a82e" stroke="#7a4e2d" stroke-width="2"/><text x="${pts[i][0]}" y="${pts[i][1]-8}" font-size="9" text-anchor="middle">${Math.round(x[1])}</text><text x="${pts[i][0]}" y="${H+22}" font-size="9" text-anchor="middle">${x[0].slice(5)}</text>`});
 return s+'</svg>'}
function weightChart(){const ws=[...D.weights].sort((a,b)=>a.d<b.d?-1:1).filter(x=>x.d>=addD(today(),-56));if(ws.length<1)return'<p class="small">還沒有體重紀錄。</p>';
 const v=ws.map(x=>x.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1,t0=pd(ws[0].d).getTime(),sp=Math.max(1,pd(ws[ws.length-1].d).getTime()-t0);
 const pt=ws.map(x=>[20+(pd(x.d).getTime()-t0)/sp*280,10+(mx-x.kg)/(mx-mn)*100]);
 return`<svg viewBox="0 0 320 130" width="100%"><polyline fill="none" stroke="#4a6fd0" stroke-width="2" points="${pt.map(p=>p.join(',')).join(' ')}"/>${pt.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#7a4e2d"/><text x="${p[0]}" y="${p[1]-6}" font-size="9" text-anchor="middle">${ws[i].kg}</text>`).join('')}<text x="2" y="126" font-size="9">${ws[0].d.slice(5)}</text><text x="318" y="126" font-size="9" text-anchor="end">${ws[ws.length-1].d.slice(5)}</text></svg>`}
let calM=today().slice(0,7);
function calHtml(){const [Y,M]=calM.split('-').map(Number),first=calM+'-01',off=(pd(first).getDay()+6)%7,n=new Date(Y,M,0).getDate();
 let h='<div class="cal">'+'一二三四五六日'.split('').map(x=>`<b>${x}</b>`).join('')+'<span></span>'.repeat(off).replace(/<span><\/span>/g,'<i></i>');
 for(let i=1;i<=n;i++){const d=calM+'-'+pad(i),f=dayFood(d),fl=full(d);let ic='·';
  if(fl)ic='⭐';else{const a=[];if(f.n&&allIn(f))a.push('●');if(f.w>=S().bt)a.push('💧');if(f.n&&!a.length)a.push('✔');if(a.length)ic=a.join('')}
  h+=`<div class="${fl?'full':''}">${i}<br><span>${ic}</span></div>`}
 return h+'</div>'}
/* ---- 主畫面 ---- */
function render(){const s=S(),t=today(),f=dayFood(t),ws=wkStart(t),wk=Math.round(weekTotal(ws)),[k0,k1]=kcalRange();

 try{toast('正在上傳頭像到 GitHub…');const ext=await ghPutAvatar(c,v);Object.assign(S(),{gh_owner:c.o,gh_repo:c.r,gh_branch:c.b,avatarExt:ext,avatarV:Date.now()});AVG='';save();render();toast('已上傳到 GitHub；約 1～2 分鐘後，其他裝置重新整理就會看到。')}
 catch(e){toast('GitHub 上傳失敗：'+(e&&e.message||'請檢查帳號、倉庫與權杖')+'（頭像仍已存在這台裝置）')}}
async function removeAvatar(){await setAvatar('');const c=ghCfg();let msg='';
 if(c.o&&c.r&&c.t){try{await ghDelAvatar(c)}catch(e){msg='GitHub 上的頭像刪除失敗：'+e.message}}else if(c.o&&c.r)msg='沒有填權杖，GitHub 倉庫裡的頭像檔沒有刪除，但已不會再顯示。';
 S().avatarExt='';S().avatarV=Date.now();AVG='';save();closeDlg();render();if(msg)toast(msg)}
async function loadRemoteAvatar(){const c=ghCfg();AVG='';if(!c.o||!c.r||S().avatarExt===''){render();return}
 const base=ghBase(c),v=S().avatarV||0,ex=[S().avatarExt].concat(EXTS).filter((e,i,a)=>e&&a.indexOf(e)===i);
 for(const e of ex){const u=base+'avatar.'+e+'?v='+v;if(await new Promise(r=>{const im=new Image();im.onload=()=>r(true);im.onerror=()=>r(false);im.src=u})){AVG=u;break}}
 render()}
function avUp(el){const f=el.files[0];if(!f)return;if(f.size>20e6){toast('圖檔超過 20 MB，請先縮小再上傳');return}
 const rd=new FileReader();rd.onload=()=>{if(f.type==='image/gif'){pickAvatar(rd.result);return}
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,1200/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pickAvatar(c.toDataURL(f.type==='image/png'?'image/png':'image/jpeg',.9))};im.onerror=()=>toast('無法讀取這個圖檔');im.src=rd.result};
 rd.readAsDataURL(f)}

function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(Object.assign({},D,{avatarData:AV}))],{type:'application/json'}));a.download='來都來了，公會_'+today()+'.json';a.click()}
function impo(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=async()=>{try{const x=JSON.parse(rd.result);if(!x||typeof x!=='object')throw 0;if(!confirm('匯入會覆蓋目前所有資料，確定嗎？（建議先匯出備份）'))return;
 const av=x.avatarData||(x.settings&&x.settings.avatar)||'';delete x.avatarData;if(x.settings)x.settings.avatar='';D=x;save();load();if(av)await setAvatar(av);else render();toast('匯入完成'+(av?'（含頭像）':''))}catch(e){toast('檔案格式不正確，未做任何變更')}};rd.readAsText(f);el.value=''}
function applyCloud(d){d.settings=Object.assign({},d.settings,{avatar:'',url:S().url});D=d;save(false);load();render();toast('已從雲端載入');loadRemoteAvatar()}
const fmtT=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false}):'無時間記錄';
const sigD=o=>JSON.stringify([o.workouts||[],o.meals||[],o.weights||[],o.water||{},o.types||[],Object.assign({},o.settings,{avatar:'',url:''})]);
let lastChk=0,chkBusy=false,skipSig='',cloudD=null;
async function keepLocal(){closeDlg();D.updatedAt=Date.now();save(false);await pushCloud()}
async function checkCloud(force){if(!S().url||chkBusy||!navigator.onLine)return;if(!force&&Date.now()-lastChk<30000)return;
 if(document.getElementById('dlg').open)return;
 chkBusy=true;lastChk=Date.now();
 try{const r=await fetch(S().url,{cache:'no-store'}),x=await r.json(),d=x&&x.data?x.data:x;
  if(!d||!d.settings){setSt('☁ 雲端目前沒有備份');return}
  const ct=d.updatedAt||0,lt=D.updatedAt||0;
  if(sigD(d)===sigD(D)){setSt('☁ 已與雲端比對：內容相同（'+new Date().toLocaleTimeString('zh-TW',{hour12:false})+'）');return}
  if(ct>0&&ct<lt){setSt('☁ 這台資料較新，正在上傳…');await pushCloud();return}
  if(sigD(d)===skipSig){setSt('☁ 雲端與這台資料不同（你選擇稍後處理）');return}
  cloudD=d;skipSig=sigD(d);setSt('☁ 雲端與這台資料不同，等待你選擇');
  open(`<h2>☁ 雲端與這台裝置的資料不同</h2><p>${ct>lt?'雲端的資料比這台新。':'雲端的資料沒有可比較的時間記錄（可能是舊版上傳的），無法判斷哪邊較新，請你選擇。'}</p><p class="small">雲端：${fmtT(ct)}<br>這台：${fmtT(lt)}</p><div class="row"><button onclick="applyCloud(cloudD);closeDlg()">載入雲端資料</button><button class="g" onclick="keepLocal()">保留這台並上傳</button><button class="g" onclick="closeDlg()">稍後再說</button></div>`)}
 catch(e){setSt('☁ 無法檢查雲端：'+(e&&e.message?e.message:'網路或網址問題'))}finally{chkBusy=false}}
async function up(){if(!S().url)return toast('請先在設定填入同步網址');if(!confirm('上傳會覆蓋雲端上的備份，確定嗎？'))return;clearTimeout(syncT);if(await pushCloud())toast('已送出上傳。請到試算表確認；若沒有資料，需確認 Apps Script 的 doPost 有處理。')}
async function down(){if(!S().url)return toast('請先在設定填入同步網址');
 try{const r=await fetch(S().url),x=await r.json(),d=x&&x.data?x.data:x;if(!d||!d.settings)throw 0;if(!confirm('下載會覆蓋目前本機資料，確定嗎？'))return;applyCloud(d)}catch(e){toast('下載失敗：雲端沒有可用的備份，或 Apps Script 回傳格式不符')}}

/* ---- 圖片辨識（Tesseract.js，在瀏覽器內執行，不需金鑰） ---- */
let tessP;
function loadTess(){return tessP||(tessP=new Promise((ok,no)=>{const e=document.createElement('script');e.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';e.onload=()=>ok(window.Tesseract);e.onerror=()=>{tessP=null;no(new Error('load'))};document.head.appendChild(e)}))}
function parseWorkout(raw){const t=raw.replace(/([\u3000-\u9fff])[ \t]+(?=[\u3000-\u9fff])/g,'$1'),o={};let m;
 const KW=[[/高強度|間歇|HIIT|循環/i,'高強度間歇／循環訓練'],[/跑步機.*坡|坡走/,'跑步機坡走（15%、3.5 km/h）'],[/跑步|跑|\brun/i,'跑步（約 8 km/h）'],[/快走/,'快走（約 5.6 km/h）'],[/步行|健走|健行|\bwalk/i,'一般步行'],[/騎|單車|自行車|cycl|bike/i,'騎自行車（中等 16–19 km/h）'],[/游泳|swim/i,'游泳（一般）'],[/重訓|重量|力量|strength/i,'重量訓練（8–15 下、多組）'],[/羽球/,'羽球（一般）'],[/籃球/,'籃球（一般）'],[/瑜[珈伽]|yoga/i,'瑜珈（哈達）']];
 let best=1e9;KW.forEach(k=>{const x=t.search(k[0]);if(x>=0&&x<best){best=x;o.type=k[1];o.name=k[1].split('（')[0]}});
 if(m=t.match(/(20\d{2})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})\s*日/))o.date=m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
 const lab=t.search(/持續時間|運動時間|活動時間|總時間|Duration/i),after=lab>=0?t.slice(lab):'';
 if(m=t.match(/(\d{1,2})\s*[:：;]\s*(\d{2})\s*[:：;]\s*(\d{2})/))o.min=Math.round(+m[1]*60+ +m[2]+ +m[3]/60);
 else if(m=t.match(/(\d+)\s*(?:小時|時|h)\s*(\d+)\s*(?:分鐘|分|m)/i))o.min=+m[1]*60+ +m[2];
 else if(m=after.match(/(\d{1,2})\s*[:：;]\s*(\d{2})(?!\s*[:：;]\s*\d)/))o.min=Math.round(+m[1]+ +m[2]/60);
 else if(m=t.match(/(\d+)\s*(?:分鐘|min)/i))o.min=+m[1];
 if(o.min!=null&&(o.min<1||o.min>1440))delete o.min;
 if(m=t.match(/(?:活動|主動)[ \t]*(?:卡路里|熱量|大卡|消耗|能量)[^\d\n]{0,6}(\d{2,4})/)||t.match(/(\d{2,4})[ \t]*(?:大卡|千卡|kcal|cal\b)/i)||t.match(/(?:健身熱量|消耗|卡路里|熱量)[^\d\n]{0,8}(\d{2,4})/)){const v=+m[1];if(v>=10&&v<=5000)o.kcal=v}
 if(m=t.match(/(\d{2,3})[ \t]*[次欠]?[ \t]*[\/／][ \t]*分/)||t.match(/(\d{2,3})[ \t]*bpm/i)||t.match(/平均[ \t]*心(?:跳率|率|跳)[^\d\n]{0,8}(\d{2,3})/)||t.match(/(?:avg|average)[^\d\n]{0,12}(\d{2,3})/i)){const v=+m[1];if(v>=40&&v<=230)o.hr=v}
 return o}
function prepImg(f){return new Promise(ok=>{const im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{try{const k=Math.max(1,1600/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  let sum=0;for(let i=0;i<p.length;i+=16)sum+=(p[i]+p[i+1]+p[i+2])/3;const inv=sum/(p.length/16)<110;
  for(let i=0;i<p.length;i+=4){let g=inv?255-Math.max(p[i],p[i+1],p[i+2]):.299*p[i]+.587*p[i+1]+.114*p[i+2];g=Math.max(0,Math.min(255,(g-110)*1.8+110));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);URL.revokeObjectURL(u);ok(c)}catch(e){URL.revokeObjectURL(u);ok(f)}};
 im.onerror=()=>{URL.revokeObjectURL(u);ok(f)};im.src=u})}
async function ocrImg(el){const f=el.files[0];if(!f)return;const st=document.getElementById('ocrSt');
 try{st.textContent='載入辨識工具…（首次約需數十秒）';const T=await loadTess();
  const r=await T.recognize(await prepImg(f),'chi_tra+eng',{logger:m=>{if(m.status)st.textContent='辨識中：'+m.status+(m.progress?' '+Math.round(m.progress*100)+'%':'')}});
  const tx=r.data.text||'';document.getElementById('ocrTx').textContent=tx;const g=parseWorkout(tx),got=[],set=(id,v)=>{document.getElementById(id).value=v};
  if(g.date){set('w_d',g.date);got.push('日期')}
  if(g.type){set('w_t',g.type);wType();set('w_n',g.name);got.push('種類／名稱')}
  if(g.min){set('w_m',g.min);got.push('時間')}
  if(g.kcal){set('w_k',g.kcal);got.push('活動卡路里')}
  if(g.hr){set('w_h',g.hr);got.push('平均心率')}
  wLive();
  st.textContent=got.length?'已帶入：'+got.join('、')+'。請對照截圖確認，沒辨識到的欄位請手動填，確認後再按儲存。':'沒有辨識到可用的欄位，請手動填寫（可展開下方看辨識到的文字）。'}
 catch(e){st.textContent='辨識失敗：請確認網路連線，並用下載的 .html 檔開啟；也可以手動填寫。'}}
render();if(!D.setup){D.setup=true;save(false);setDlg()}
